<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday 🎂</title>

  <link href="assets/css/reset.css" rel="stylesheet" />
  <link href="assets/css/stylesheet.css" rel="stylesheet" />
  <link href="assets/css/birthday.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Patrick+Hand+SC" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png" />
</head>

<body>
  <!-- ====================== 1. LOGIN ====================== -->
  <section id="screen-login" class="screen active">
    <div class="card">
      <h1 id="login-title" class="title"></h1>
      <p id="login-subtitle" class="subtitle"></p>

      <label id="login-nama-label" class="field-label"></label>
      <input id="login-nama" class="field" type="text" autocomplete="off" />

      <label id="login-umur-label" class="field-label"></label>
      <input id="login-umur" class="field" type="text" autocomplete="off" />

      <p id="login-error" class="error-msg"></p>
      <button id="login-btn" class="btn"></button>
    </div>
  </section>

  <!-- ====================== 2. MENU ====================== -->
  <section id="screen-menu" class="screen">
    <div class="card">
      <h1 id="menu-title" class="title big"></h1>
      <p id="menu-subtitle" class="subtitle"></p>
      <button id="menu-btn" class="btn letsgo"></button>
    </div>
  </section>

  <!-- ====================== 3. SUB-GAME 1: PILIH FOTO ====================== -->
  <section id="screen-subgame1" class="screen">
    <div class="card wide">
      <h2 id="sg1-pertanyaan" class="title"></h2>
      <p id="sg1-petunjuk" class="subtitle"></p>
      <div id="sg1-grid" class="photo-grid"></div>
      <p id="sg1-error" class="error-msg"></p>
      <button id="sg1-btn" class="btn"></button>
    </div>
  </section>

  <!-- ====================== 4. GAME MARIO ====================== -->
  <section id="screen-game" class="screen">
    <div class="game-wrap">
      <div id="mute-button"></div>
      <canvas id="game-canvas" width="760" height="600"></canvas>
      <p class="controls-hint">Gerak: &#8592; &#8594; / A D &nbsp;&nbsp;|&nbsp;&nbsp; Lompat: &#8593; / W / Spasi</p>
    </div>
    <audio id="background_music" loop>
      <source src="./assets/audio/music/mario_theme.mp3" type="audio/mp3" />
    </audio>
  </section>

  <!-- ====================== POP-UP UMUM (teks kustom) ====================== -->
  <div id="popup" class="overlay">
    <div class="card popup-card">
      <h2 id="popup-title" class="title"></h2>
      <p id="popup-text" class="popup-text"></p>
      <button id="popup-btn" class="btn"></button>
    </div>
  </div>

  <!-- ====================== POP-UP QUIZ MARIO ====================== -->
  <div id="quiz" class="overlay">
    <div class="card quiz-card">
      <div class="qmark">?</div>
      <h2 id="quiz-pertanyaan" class="title"></h2>
      <!-- daftar opsi -->
      <div id="quiz-opsi" class="quiz-options"></div>
      <!-- langkah konfirmasi (tersembunyi sampai opsi dipilih) -->
      <div id="quiz-konfirmasi" class="quiz-confirm" style="display:none">
        <p id="quiz-konfirmasi-teks" class="confirm-text"></p>
        <p id="quiz-pilihan" class="confirm-choice"></p>
        <div class="confirm-buttons">
          <button id="quiz-batal" class="btn ghost"></button>
          <button id="quiz-ya" class="btn"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====================== KOTAK REVIEW (akhir game) ====================== -->
  <div id="review" class="overlay">
    <div class="card review-card">
      <h2 id="review-title" class="title"></h2>
      <p id="review-eskrim" class="review-eskrim"></p>
      <p id="review-jawaban-label" class="review-label"></p>
      <ol id="review-list" class="review-list"></ol>
      <button id="review-btn" class="btn"></button>
    </div>
  </div>

  <script src="assets/javascripts/jquery.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/javascripts/bundle.js"></script>
  <script src="app.js"></script>
</body>

</html>
